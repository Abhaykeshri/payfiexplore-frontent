<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- ========================================= -->
    <!-- BASIC -->
    <!-- ========================================= -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ========================================= -->
    <!-- TITLE -->
    <!-- ========================================= -->
    <title>PayFi Explorer | Real-Time Blockchain Explorer</title>

    <!-- ========================================= -->
    <!-- SEO -->
    <!-- ========================================= -->
    <meta
      name="description"
      content="PayFi Explorer is a real-time blockchain explorer for the PayFi Network. Track blocks, transactions, validators, wallets, staking, and analytics."
    />

    <meta
      name="keywords"
      content="PayFi, PayFi Explorer, Blockchain Explorer, Crypto Explorer, Web3, Layer 1 Blockchain, Transactions, Validators, Wallet Explorer"
    />

    <meta name="author" content="PayFi Team" />

    <meta name="robots" content="index, follow" />

    <meta name="theme-color" content="#050816" />

    <!-- ========================================= -->
    <!-- OPEN GRAPH -->
    <!-- ========================================= -->
    <meta
      property="og:title"
      content="PayFi Explorer | Real-Time Blockchain Explorer"
    />

    <meta
      property="og:description"
      content="Explore blocks, transactions, wallets, validators, and network analytics on the PayFi Blockchain."
    />

    <meta
      property="og:url"
      content="https://explorer.payfi.network"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="PayFi Explorer"
    />

    <!-- ========================================= -->
    <!-- TWITTER -->
    <!-- ========================================= -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="PayFi Explorer | Real-Time Blockchain Explorer"
    />

    <meta
      name="twitter:description"
      content="Track PayFi blockchain activity live including blocks, transactions, validators, and wallets."
    />

    <!-- ========================================= -->
    <!-- CANONICAL -->
    <!-- ========================================= -->
    <link
      rel="canonical"
      href="https://explorer.payfi.network"
    />

    <!-- ========================================= -->
    <!-- GOOGLE FONT -->
    <!-- ========================================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- ========================================= -->
    <!-- GLOBAL STYLE -->
    <!-- ========================================= -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background: #050816;
        color: white;
        font-family: "Inter", sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
      }

      #root {
        min-height: 100vh;
      }
    </style>
  </head>

  <body>
    <!-- ========================================= -->
    <!-- REACT APP -->
    <!-- ========================================= -->
    <div id="root"></div>

    <!-- ========================================= -->
    <!-- VITE ENTRY -->
    <!-- ========================================= -->
    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
